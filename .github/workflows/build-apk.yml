
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.solanaagent.v2000'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solanaagent.v2000'
        minSdk 23
        targetSdk 35
        versionCode 2000
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
